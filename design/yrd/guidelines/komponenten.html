<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>yrd · Komponentenübersicht</title><script src="../card-runtime-v2.js"></script></head><body class="bg-background text-foreground"><div id="root"></div>
<script type="text/babel">
const Y = window.YrdDesignSystem_d6c60f;

      <section><H>Tabs · Card · Dropdown Menu</H><div className="flex items-center justify-between gap-3 mb-3"><Tabs variant="segmented" tabs={[{ id: "heute", label: "Heute" }, { id: "morgen", label: "Morgen" }, { id: "woche", label: "Woche" }]} value={tab} onChange={setTab} /><DropdownMenu trigger={<Button variant="ghost" icon="CircleUser" iconRight="ChevronDown">Sandra K.</Button>} items={[{ heading: "sandra.k@hollerbach.de" }, { id: "p", label: "Profil", icon: "User" }, { custom: <ThemeSwitch showLabel={false} value={theme} onChange={setTheme} /> }, { separator: true }, { id: "o", label: "Abmelden", icon: "LogOut" }]} /></div><Tabs tabs={[{ id: "a", label: "Eingangskorb", count: 3, icon: "Inbox" }, { id: "b", label: "Buchungen", count: 42 }, { id: "c", label: "Konflikte", count: 1 }]} className="mb-3" /><Card title="Entscheidungsfall" description="B-1043 · Trans-Pol Sp. z o.o. · angefragt" actions={<Badge variant="proposal">Vorschlag</Badge>} footer={<><Button size="sm" onClick={() => setDlg(true)}>Bestätigen</Button><Button size="sm" variant="outline" onClick={() => setSheet(true)}>Detail</Button></>}><p className="text-sm text-muted-foreground">Tiefkühl Anlieferung, Do 15.10., Anmeldung bis 14:15 Uhr. Das System schlägt Rampe 9 vor – ein Mensch entscheidet.</p></Card></section>

      <section><H>Sidebar</H><div className="h-72 flex rounded-md border border-border overflow-hidden"><Sidebar context="Frischelager Hollerbach · Augsburg" items={[{ id: "heute", label: "Heute", icon: "CalendarDays" }, { id: "korb", label: "Eingangskorb", icon: "Inbox", count: 3, urgent: true }, { id: "zeit", label: "Zeitleiste", icon: "GanttChart" }, { id: "carrier", label: "Carrier", icon: "Truck", section: "Verwaltung" }]} value="heute" /><div className="flex-1 p-4 text-sm text-muted-foreground">Inhalt</div></div></section>
      <section className="lg:col-span-2"><H>shadcn/ui-Komponenten in diesem System</H><dl className="grid gap-x-6 gap-y-1.5 text-sm sm:grid-cols-2 lg:grid-cols-3">{Object.entries(shadcn).map(([k, v]) => <div key={k} className="flex gap-2"><dt className="font-medium shrink-0 w-40">{k}</dt><dd className="text-muted-foreground">{v}</dd></div>)}</dl></section>
    </main>
    <Dialog open={dlg} onClose={() => setDlg(false)} title="Buchung bestätigen?" description="B-1043 erhält Rampenzeit 14:30 an Rampe 9. Der Carrier sieht nur „Anmeldung bis 14:15 Uhr“." footer={<><Button variant="ghost" onClick={() => setDlg(false)}>Abbrechen</Button><Button icon="Check" onClick={() => { setDlg(false); toast({ tone: "success", title: "B-1043 bestätigt" }); }}>Bestätigen</Button></>} />
    <Sheet open={sheet} onClose={() => setSheet(false)} title="B-1042 · Spedition Müller GmbH" description="Tiefkühl Anlieferung · Do 15.10. · 5 Paletten Schinken" footer={<><Button variant="outline">Verschieben</Button><Button icon="Check">Bestätigen</Button></>}><h3 className="text-sm font-medium text-muted-foreground mb-2">Historie</h3><ol className="flex flex-col gap-2 text-sm">{[["Do 15.10. 13:41", "Check-in an der Pforte", "Erwin B."], ["Mi 14.10. 16:02", "Fahrer zugewiesen: Andrzej Nowak", "Agnieszka W. (Carrier)"], ["Mi 14.10. 09:30", "Bestätigt, Rampenzeit 14:00, Rampe 8", "Sandra K."], ["Di 13.10. 15:12", "Angefragt", "Agnieszka W. (Carrier)"]].map(([t, w, who]) => <li key={t} className="grid grid-cols-[130px_1fr] gap-2"><span className="text-muted-foreground tabular-nums">{t}</span><span>{w}<span className="block text-xs text-muted-foreground">{who}</span></span></li>)}</ol></Sheet>
    <div className="fixed bottom-4 right-4 z-50 flex flex-col gap-2">{toasts.map((t) => <Toast key={t.id} {...t} onClose={() => setToasts((x) => x.filter((y) => y.id !== t.id))} />)}</div>
  </div>;
}
ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script></body></html>
