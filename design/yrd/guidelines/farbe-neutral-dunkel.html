<!-- @dsCard group="Farben" viewport="700x230" name="Neutrale Flächen · Dunkel" subtitle=".dark – gleichwertig, keine abgespeckte Fassung" -->
<!doctype html><html lang="de"><head><meta charset="utf-8"><script src="../card-lite-v2.js"></script></head><script>function fill(root){root.querySelectorAll('[data-token]').forEach(function(el){var v=getComputedStyle(el.closest('.dark')||document.documentElement).getPropertyValue(el.dataset.token).trim();el.querySelector('.hex').textContent=v.toUpperCase();var sw=el.querySelector('.sw');if(sw)sw.style.background='var('+el.dataset.token+')';});}document.addEventListener('DOMContentLoaded',function(){fill(document)});</script><body class="m-0"><div class="dark bg-background text-foreground p-4 grid gap-3" style="grid-template-columns:repeat(6,minmax(0,1fr))"><div data-token="--background" class="flex flex-col gap-1.5 min-w-0"><div class="sw h-12 rounded-md border border-border flex items-end px-2 pb-1.5 text-xs font-medium" style="color:var(--foreground)">Aa</div><div class="text-xs font-medium truncate">background</div><div class="hex font-mono text-xs text-muted-foreground"></div></div><div data-token="--card" class="flex flex-col gap-1.5 min-w-0"><div class="sw h-12 rounded-md border border-border flex items-end px-2 pb-1.5 text-xs font-medium" style="color:var(--card-foreground)">Aa</div><div class="text-xs font-medium truncate">card</div><div class="hex font-mono text-xs text-muted-foreground"></div></div><div data-token="--popover" class="flex flex-col gap-1.5 min-w-0"><div class="sw h-12 rounded-md border border-border flex items-end px-2 pb-1.5 text-xs font-medium" style="color:var(--popover-foreground)">Aa</div><div class="text-xs font-medium truncate">popover</div><div class="hex font-mono text-xs text-muted-foreground"></div></div><div data-token="--muted" class="flex flex-col gap-1.5 min-w-0"><div class="sw h-12 rounded-md border border-border flex items-end px-2 pb-1.5 text-xs font-medium" style="color:var(--muted-foreground)">Aa</div><div class="text-xs font-medium truncate">muted</div><div class="hex font-mono text-xs text-muted-foreground"></div></div><div data-token="--secondary" class="flex flex-col gap-1.5 min-w-0"><div class="sw h-12 rounded-md border border-border flex items-end px-2 pb-1.5 text-xs font-medium" style="color:var(--secondary-foreground)">Aa</div><div class="text-xs font-medium truncate">secondary</div><div class="hex font-mono text-xs text-muted-foreground"></div></div><div data-token="--border" class="flex flex-col gap-1.5 min-w-0"><div class="sw h-12 rounded-md border border-border flex items-end px-2 pb-1.5 text-xs font-medium" ></div><div class="text-xs font-medium truncate">border</div><div class="hex font-mono text-xs text-muted-foreground"></div></div><div data-token="--input" class="flex flex-col gap-1.5 min-w-0"><div class="sw h-12 rounded-md border border-border flex items-end px-2 pb-1.5 text-xs font-medium" ></div><div class="text-xs font-medium truncate">input</div><div class="hex font-mono text-xs text-muted-foreground"></div></div><div data-token="--sidebar" class="flex flex-col gap-1.5 min-w-0"><div class="sw h-12 rounded-md border border-border flex items-end px-2 pb-1.5 text-xs font-medium" style="color:var(--sidebar-foreground)">Aa</div><div class="text-xs font-medium truncate">sidebar</div><div class="hex font-mono text-xs text-muted-foreground"></div></div><div data-token="--sidebar-accent" class="flex flex-col gap-1.5 min-w-0"><div class="sw h-12 rounded-md border border-border flex items-end px-2 pb-1.5 text-xs font-medium" style="color:var(--sidebar-accent-foreground)">Aa</div><div class="text-xs font-medium truncate">sidebar-accent</div><div class="hex font-mono text-xs text-muted-foreground"></div></div><div data-token="--destructive" class="flex flex-col gap-1.5 min-w-0"><div class="sw h-12 rounded-md border border-border flex items-end px-2 pb-1.5 text-xs font-medium" style="color:var(--destructive-foreground)">Aa</div><div class="text-xs font-medium truncate">destructive</div><div class="hex font-mono text-xs text-muted-foreground"></div></div><div data-token="--foreground" class="flex flex-col gap-1.5 min-w-0"><div class="sw h-12 rounded-md border border-border flex items-end px-2 pb-1.5 text-xs font-medium" ></div><div class="text-xs font-medium truncate">foreground</div><div class="hex font-mono text-xs text-muted-foreground"></div></div><div data-token="--muted-foreground" class="flex flex-col gap-1.5 min-w-0"><div class="sw h-12 rounded-md border border-border flex items-end px-2 pb-1.5 text-xs font-medium" ></div><div class="text-xs font-medium truncate">muted-foreground</div><div class="hex font-mono text-xs text-muted-foreground"></div></div></div></body></html>
